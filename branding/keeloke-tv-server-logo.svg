<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">

  <!-- camera body -->
  <rect x="60" y="80" width="150" height="100" rx="14" fill="#a06de0" stroke="#39d353" stroke-width="6" stroke-linejoin="round"/>

  <!-- lens trumpet -->
  <polygon points="210,105 300,70 300,190 210,155" fill="#a06de0" stroke="#39d353" stroke-width="6" stroke-linejoin="round"/>

  <!-- top reels -->
  <circle cx="95" cy="55" r="30" fill="#a06de0" stroke="#39d353" stroke-width="6"/>
  <circle cx="95" cy="55" r="10" fill="#7a4fc0" stroke="#39d353" stroke-width="6"/>
  <circle cx="160" cy="55" r="30" fill="#a06de0" stroke="#39d353" stroke-width="6"/>
  <circle cx="160" cy="55" r="10" fill="#7a4fc0" stroke="#39d353" stroke-width="6"/>

  <!-- reel arms -->
  <rect x="88" y="70" width="14" height="25" fill="#a06de0" stroke="#39d353" stroke-width="6" stroke-linejoin="round"/>
  <rect x="153" y="70" width="14" height="25" fill="#a06de0" stroke="#39d353" stroke-width="6" stroke-linejoin="round"/>

  <!-- lens front circle -->
  <circle cx="270" cy="130" r="14" fill="#7a4fc0" stroke="#39d353" stroke-width="6"/>

  <!-- little screen/button on body -->
  <rect x="95" y="115" width="45" height="35" rx="4" fill="#7a4fc0" stroke="#39d353" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="185" cy="165" r="8" fill="#7a4fc0" stroke="#39d353" stroke-width="6"/>

  <!-- text -->
  <text x="200" y="235" font-family="Verdana, Arial, sans-serif" font-weight="bold"
        font-size="34" fill="#39d353" text-anchor="middle">Keeloke TV Server</text>
</svg>
