# Keeloke TV Server - configuración de Redis para producción.
#
# Redis aquí no es un caché descartable: cluster-registry-plugin,
# security-plugin, tenant-quota-plugin y conference-rooms-plugin guardan en
# él el estado real (nodos del cluster, config de seguridad por tenant,
# cuotas/uso, salas de conferencia activas). Si Redis se cae sin
# persistencia o queda expuesto sin contraseña, se pierde ese estado o
# queda abierto a cualquiera en la red.
#
# Uso:
#   redis-server /ruta/a/redis-production.conf
#
# o fusiona estas líneas en tu redis.conf existente. Reemplaza
# CAMBIA_ESTA_CONTRASEÑA por un valor real generado (ej. `openssl rand -hex 32`)
# antes de usar esto en un servidor real.

# --- Red: solo localhost por defecto. Si el servidor Keeloke TV y Redis
#     corren en la misma máquina (lo normal), esto es lo más seguro.
#     Si Redis vive en otra máquina, cambia a la IP privada de esa red,
#     NUNCA 0.0.0.0 sin firewall + requirepass.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# --- Autenticación: obligatorio para producción.
requirepass CAMBIA_ESTA_CONTRASEÑA

# --- Persistencia: AOF (append-only file) para pérdida mínima de datos
#     ante un crash, además de los snapshots RDB por defecto.
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Snapshots RDB (respaldo adicional / arranque más rápido)
save 3600 1
save 300 100
save 60 10000

# --- Memoria: Redis se usa como base de datos aquí, no como caché -
#     nunca debe borrar claves silenciosamente por presión de memoria.
maxmemory-policy noeviction

# --- Logging
loglevel notice
